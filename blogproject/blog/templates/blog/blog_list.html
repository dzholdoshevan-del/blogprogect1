<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><title>Блог</title></head>
<body>
  <h1>Все статьи</h1>
  {% for blog in blogs %}
    <article>
      <h2><a href="{% url 'blog:detail' blog.pk %}">{{ blog.title }}</a></h2>
      <p>{{ blog.content|truncatechars:100 }}</p>
      <small>Лайки: {{ blog.likes }}</small>
    </article>
  {% empty %}
    <p>Статей пока нет.</p>
  {% endfor %}
</body>
</html>

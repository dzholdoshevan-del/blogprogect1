<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{% block title %}CRUD{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
    a.btn, button { display: inline-block; padding: 6px 12px; border: 1px solid #888;
                    background: #f4f4f4; color: #000; text-decoration: none; cursor: pointer; }
    .danger { border-color: #c33; color: #c33; }
    li { margin-bottom: 8px; }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>

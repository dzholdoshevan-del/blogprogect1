{% extends 'crud/base.html' %}
{% block title %}{{ item.title }}{% endblock %}
{% block content %}
  <a href="{% url 'crud:list' %}">&larr; К списку</a>
  <h1>{{ item.title }}</h1>
  <p>{{ item.description }}</p>
  <small>Создан: {{ item.created_at|date:"d.m.Y H:i" }}</small>
  <p>
    <a class="btn" href="{% url 'crud:update' item.pk %}">Изменить</a>
    <a class="btn danger" href="{% url 'crud:delete' item.pk %}">Удалить</a>
  </p>
{% endblock %}

{% extends 'crud/base.html' %}
{% block title %}Удаление{% endblock %}
{% block content %}
  <h1>Удалить «{{ item.title }}»?</h1>
  <form method="post">
    {% csrf_token %}
    <button class="danger" type="submit">Да, удалить</button>
    <a href="{{ item.get_absolute_url }}">Отмена</a>
  </form>
{% endblock %}
